name: Backend CI/CD to NCP

on:
  push:
    branches: [ "main", "feature/back" ]
    paths:
      - 'back/**' # back 폴더 내부 코드가 변경되었을 때만 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 백엔드 폴더로 이동해서 Gradle 빌드 수행
    - name: Build with Gradle
      run: |
        cd back
        chmod +x gradlew
        ./gradlew clean build -x test

    # 빌드된 JAR 파일을 NCP 서버로 전송
    - name: Transfer JAR to NCP Server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.BACK_NCP_HOST }}
        username: ${{ secrets.BACK_NCP_USERNAME }}
        key: ${{ secrets.BACK_NCP_KEY }}      # password 대신 key 지정
        port: ${{ secrets.BACK_NCP_PORT }}
        source: "back/build/libs/*.jar"
        target: "/root"
        strip_components: 3 # 경로 분리 깊이에 맞춰 조정

    # SSH 명령어 실행
    - name: Execute Remote SSH Commands
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.NCP_HOST }}
        username: ${{ secrets.NCP_USERNAME }}
        key: ${{ secrets.BACK_NCP_KEY }}      # password 대신 key 지정
        port: ${{ secrets.NCP_PORT }}
        script: |
          cd /root
          chmod +x start.sh
          ./start.sh
