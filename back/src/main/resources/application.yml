spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/local_db}
    username: ${DB_USERNAME:username}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
  jpa:
    hibernate:
      ddl-auto: update # DB table auto update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp.naver.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: ${MAIL_HOST:smtp.naver.com}
jwt:
  secret: ${JWT_SECRET:jwt.secret} # base64 encoded secret (prod: JWT_SECRET env var)
  access-token-expiration: 3600000      # 1hour (ms)
  refresh-token-expiration: 604800000   # 7days (ms)

email-verification:
  code-expiration-ms: ${EMAIL_VERIFICATION_CODE_EXPIRATION_MS:300000}   # 5minutes (ms)

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always